name: 🐛 Bug Report
description: Report a bug or glitch in LeviLaunchroid.
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: checkboxes
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am using the latest version of LeviLaunchroid.
          required: true
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of LeviLaunchroid are you running?
      placeholder: e.g., v5.0.8
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android OS Version
      description: Which version of Android is your device running?
      placeholder: e.g., Android 13
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device Model
      description: What device are you using?
      placeholder: e.g., Samsung Galaxy S22, POCO X3 Pro
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Version (Optional)
      description: What version of Minecraft Bedrock are you using? Leave blank if the bug is not game-related.
      placeholder: e.g., 1.21.0
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: I was trying to... but then the app did...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Explain step-by-step how to reproduce the error.
      placeholder: |
        1. Open the app
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: I expected the app to launch the game successfully without graphical glitches.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other details or attach screenshots/screen recordings here.
      placeholder: Drop your screenshots or videos here, or add any extra context.
    validations:
      required: false