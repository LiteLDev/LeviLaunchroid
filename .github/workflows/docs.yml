name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs.yml
      - docs/**
  # levimc-kit (the LeviMC bar, footer and docs engine) is published by levimc.org and fetched by the package
  # install: levimc.org triggers this workflow when it publishes a new kit, and the hourly check below catches up.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

jobs:
  # On the schedule: build only when levimc.org publishes a kit the live site does not run yet.
  kit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - id: check
        run: |
          want=$(curl -fsSL https://levimc.org/kit/v2/manifest.json | jq -r '"levimc-kit " + .version + "+" + .build')
          have=$(curl -fsSL https://docs.levimc.org/LeviLaunchroid/ | grep -o 'levimc-kit [^"]*' | head -1)
          echo "live: $have · published: $want"
          echo "stale=$([ "$want" != "$have" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: kit
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.kit.outputs.stale == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # full history for the per-page "Last updated" dates
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        working-directory: docs
        run: npm ci

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Check internal links
        working-directory: docs
        run: npm run linkcheck

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist/

  deploy:
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
